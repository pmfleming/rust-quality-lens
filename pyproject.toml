[project]
name = "rust-quality-lens"
version = "0.1.0"
description = "Reusable quality measurement tools for Rust projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rust-quality-lens = "rust_quality_lens.cli:main"
rqlens = "rust_quality_lens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
