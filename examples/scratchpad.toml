project_name = "scratchpad"
project_root = "../../scratchpad"
# Omit source_roots to include Scratchpad and its local path packages.
output_dir = "target/analysis"

[rust]
# By default the CLI uses the helper crate bundled with rust-quality-lens.
# Override this only if a project vendors or forks the helper binaries.
# helper_manifest = "../rust-quality-lens/rust_helpers/Cargo.toml"

[verification]
timeout_seconds = 1200
workspace = true
all_targets = false
all_features = true
audit = true
deny = false
feature_matrix = true

[policy.rules."rust.project.license"]
level = "error"
max = 0

[policy.rules."rust.safety.undocumented-unsafe"]
level = "error"
max = 0

[policy.rules."rust.safety.missing-safety-docs"]
level = "error"
max = 0

[policy.rules."rust.reliability.expect"]
level = "error"
max = 14
exclude_paths = ["src/bin/**", "src/profile/**"]

[policy.rules."rust.reliability.panic"]
level = "error"
max = 3
exclude_paths = ["src/bin/**", "src/profile/**"]

[[policy.waivers]]
rule_id = "rust.project.license"
reason = "Repository owner must choose and approve the distribution license"
owner = "pmfleming"
expires = "2026-10-31"
