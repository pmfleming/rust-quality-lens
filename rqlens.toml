project_name = "rust-quality-lens"
project_root = "."
# Measure implementation and integration tests, but not synthetic fixture programs.
source_roots = [
    "src", "rust_helpers/src", "compiler_helpers/src", "compiler_helpers/build.rs",
    "tests/cli.rs", "tests/compiler_inventory.rs", "tests/source_expansion.rs",
    "tests/trust.rs", "tests/profiles.rs", "tests/lexical_ownership.rs",
    "tests/compiler_architecture.rs", "tests/compiler_architecture",
    "tests/testing_policy.rs", "tests/testing_policy", "tests/support",
]
output_dir = "target/analysis"

[testing_policy]
manifest = "rqlens-testing.toml"
evidence_inputs = ["docs/testing-policy.md", "docs/quality-model.md", "contracts/determinism.md", "docs/evidence-pipeline.md"]

[rust]
identity_resolution = "auto"
identity_offline = true

[verification]
timeout_seconds = 600
workspace = true
all_targets = true
all_features = false
locked = true
audit = false
deny = false
semver = false
feature_matrix = false
mutation = false
flaky_test_runs = 1
fuzz_targets = []
fuzz_seconds = 30
sanitizers = []
miri = false

[policy.rules."rust.testing.required-owner"]
level = "error"
max = 0

[policy.rules."rust.safety.undocumented-unsafe"]
level = "error"
max = 0

[policy.rules."rust.safety.missing-safety-docs"]
level = "error"
max = 0

[policy.rules."rust.reliability.unwrap"]
level = "error"
max = 0

[policy.rules."rust.reliability.expect"]
level = "error"
max = 0

[policy.rules."rust.reliability.panic"]
level = "error"
max = 0

[policy.rules."rust.reliability.todo"]
level = "error"
max = 0

[policy.rules."rust.reliability.unimplemented"]
level = "error"
max = 0
