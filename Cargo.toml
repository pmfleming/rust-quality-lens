[package]
name = "rust-quality-lens"
version = "0.1.0"
edition = "2024"
description = "Reusable measurement JSON producers for Rust projects."

[[bin]]
name = "rqlens"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hostname = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
toml = "0.8"
walkdir = "2.5"
