name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy, rust-analyzer, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check bundled helper sources
        run: bash scripts/check-bundled-helpers.sh

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: RustSec audit
        uses: rustsec/audit-check@v2

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Verify Rust practices
        run: cargo run --locked --bin rqlens -- verify

      - name: Package smoke test
        run: bash scripts/check-package.sh

      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked

      - name: Catalog
        run: cargo run --locked --bin rqlens -- catalog

      - name: Measure
        run: cargo run --locked --bin rqlens -- measure all

      - name: Enforce self-metric baseline
        run: bash scripts/check-self-metrics.sh

      - name: Export SARIF
        run: cargo run --locked --bin rqlens -- sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqlens-sarif
          path: target/analysis/rqlens.sarif

      - name: Enforce measurement policy
        run: cargo run --locked --bin rqlens -- check --fail-on partial --fail-on test-failure --fail-on practice-failure --fail-on reliability-finding

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  latest-stable:
    name: Forward compatibility (latest stable)
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  platforms:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo run --locked --bin rqlens -- measure reliability --config tests/fixtures/mini_rust_project/rqlens.toml
